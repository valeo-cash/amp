[package]
name = "amp-channel"
version = "0.2.0"
description = "AMP - Autonomous Machine Payments - Solana Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "amp_channel"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
constant_time_eq = "=0.3.1"
